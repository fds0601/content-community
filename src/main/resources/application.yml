server:
  port: 8080

spring:
  application:
    name: content-community
  profiles:
    active: local
  datasource:
    url: jdbc:mysql://localhost:3306/community?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:your_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # 生产环境请替换为足够长的随机字符串
  secret: ZGV2LWxvY2F0aW9uLWp3dC1zZWNyZXQta2V5LWZvci1jb21tdW5pdHktcG9ydGZvbA==
  expiration: 86400000

knife4j:
  enable: true
  setting:
    language: zh_cn
